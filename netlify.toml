# Netlify configuration for the Tshepe Game Farm website (static site, no build step).
[build]
  publish = "."

# ---------------------------------------------------------------------------
# HTTPS
# Netlify serves every site over HTTPS and redirects http:// to https://
# automatically once the certificate is issued (Domain management > HTTPS).
# When the production domain is connected, uncomment the rule below so the
# netlify.app address permanently redirects to it (replace the domain first).
# ---------------------------------------------------------------------------
# [[redirects]]
#   from = "https://tshepe.netlify.app/*"
#   to = "https://www.example.co.za/:splat"
#   status = 301
#   force = true

# ---------------------------------------------------------------------------
# Security headers for every response
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------------------------------------------------------------------------
# Caching: fonts never change; photos rarely; CSS/JS/HTML revalidate.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# ---------------------------------------------------------------------------
# Rate limiting
# The site has no server endpoints, logins or form submissions, so there is
# nothing to rate-limit today. If a Netlify Function (for example an enquiry
# endpoint or a login) is added, give it a code-based limit in its own config:
#   export const config = { path: "/api/enquiry",
#     rateLimit: { windowLimit: 5, windowSize: 60, aggregateBy: ["ip", "domain"] } };
# See SECURITY.md.
# ---------------------------------------------------------------------------
